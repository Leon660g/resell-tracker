<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💰 Sales — RR Resell Tracker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #0f172a; color: white; min-height: 100vh; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap:15px; }
        h1 { font-size: 1.8rem; }
        .btn { padding: 10px 18px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn-back { background: #475569; color: white; }
        .btn-logout { background: #ef4444; color: white; }
        .card { background: #1e293b; border-radius: 16px; padding: 24px; margin-bottom: 20px; }
        .card h2 { font-size: 1.2rem; margin-bottom: 15px; color: #3b82f6; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
        input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; }
        .btn-primary { background: #3b82f6; color: white; margin-top: 8px; width:100%; }
        .sale { background: #2a3447; padding: 15px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap:10px; }
        .profit { color: #10b981; font-weight: bold; }
        .btn-delete { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
        .total { font-size: 1.3rem; font-weight: bold; text-align: right; margin-top: 15px; padding-top: 15px; border-top: 1px solid #334155; }
        .empty { color: #94a3b8; text-align: center; padding: 30px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💰 Sales Tracker</h1>
            <div style="display:flex;gap:10px;">
                <a href="index.html" class="btn btn-back">← Home</a>
                <button class="btn btn-logout" onclick="logout()">Logout</button>
            </div>
        </div>
        <div class="card">
            <h2>➕ Record Sale</h2>
            <div class="form-grid">
                <div><label>Item Name</label><input type="text" id="saleName" placeholder="e.g. Sneakers"></div>
                <div><label>Bought (£)</label><input type="number" step="0.01" id="buyPrice" placeholder="0.00"></div>
                <div><label>Sold For (£)</label><input type="number" step="0.01" id="sellPrice" placeholder="0.00"></div>
            </div>
            <button class="btn btn-primary" onclick="addSale()">➕ Record Sale</button>
        </div>
        <div class="card">
            <h2>📋 Sales History</h2>
            <div id="salesList"><p class="empty">No sales recorded yet!</p></div>
            <div class="total">Total Profit: £<span id="totalProfit">0.00</span></div>
        </div>
    </div>
<script>
let sales = [];
function renderSales() {
    const list = document.getElementById('salesList');
    if (sales.length === 0) { list.innerHTML = '<p class="empty">No sales recorded yet!</p>'; document.getElementById('totalProfit').textContent = '0.00'; return; }
    let total = 0;
    list.innerHTML = sales.map((sale, index) => {
        total += sale.profit;
        return `<div class="sale"><div><strong>${sale.name}</strong><br>Bought: £${sale.buy.toFixed(2)} → Sold: £${sale.sell.toFixed(2)} <span class="profit"> • Profit: £${sale.profit.toFixed(2)}</span></div><button class="btn-delete" onclick="deleteSale(${index})">🗑️</button></div>`;
    }).join('');
    document.getElementById('totalProfit').textContent = total.toFixed(2);
}
function addSale() {
    const name = document.getElementById('saleName').value.trim();
    const buy = parseFloat(document.getElementById('buyPrice').value);
    const sell = parseFloat(document.getElementById('sellPrice').value);
    if (!name || isNaN(buy) || isNaN(sell)) return alert('Fill in all fields!');
    sales.unshift({ name, buy, sell, profit: sell - buy });
    saveToDB(); renderSales();
    document.getElementById('saleName').value = ''; document.getElementById('buyPrice').value = ''; document.getElementById('sellPrice').value = '';
}
function deleteSale(index) {
    if (confirm('Delete this sale?')) { sales.splice(index, 1); saveToDB(); renderSales(); }
}
function saveToDB() {
    fetch('/api/user/save', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ dataType: 'sales', data: { sales } }) });
}
async function loadFromDB() {
    const res = await fetch('/api/user/load/sales');
    const result = await res.json();
    if (result.data && result.data.sales) { sales = result.data.sales; renderSales(); }
}
function logout() { window.location.href = '/api/logout'; }
window.addEventListener('load', loadFromDB);
</script>
</body>
</html>

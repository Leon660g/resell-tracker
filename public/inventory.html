<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>INVENTORY — ResellTracker</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Courier New',monospace; }
        :root { --g:#00ff41; --gd:#00aa22; --bg:#050505; --card:#0a1a0a; --border:#005511; --red:#ff4444; --blue:#00ccff; --yellow:#ffdd00; }
        body { background:var(--bg); color:var(--g); }
        .bar { display:flex; background:rgba(0,30,5,0.9); border-bottom:2px solid var(--g); padding:12px 25px; align-items:center; position:sticky; top:0; z-index:99; }
        .logo { font-size:1.3rem; font-weight:bold; margin-right:auto; letter-spacing:1px; }
        .nav { display:flex; gap:8px; flex-wrap:wrap; }
        .btn { padding:9px 14px; border:1px solid var(--g); background:transparent; color:var(--g); border-radius:4px; cursor:pointer; font-family:inherit; transition:all 0.2s; }
        .btn:hover, .btn.active { background:var(--g); color:#002200; box-shadow:0 0 12px var(--g); }
        .btn.red { border-color:var(--red); color:var(--red); }
        .btn.red:hover { background:var(--red); color:#220000; box-shadow:0 0 12px var(--red); }
        .wrap { max-width:1200px; margin:0 auto; padding:30px; }
        .title { font-size:1.6rem; margin-bottom:25px; }
        .glow { text-shadow:0 0 8px var(--g),0 0 16px var(--g); }

        /* === FORM === */
        .form-box { border:1px solid var(--g); background:var(--card); padding:25px; border-radius:8px; margin-bottom:30px; box-shadow:0 0 15px rgba(0,255,65,0.15); }
        .row { display:grid; grid-template-columns:repeat(3,1fr); gap:15px; }
        .row2 { display:grid; grid-template-columns:repeat(2,1fr); gap:15px; }
        .field { margin-bottom:15px; }
        label { display:block; margin-bottom:5px; color:var(--gd); font-size:0.9rem; }
        input, select, textarea { width:100%; padding:10px; background:#081a08; border:1px solid var(--border); color:var(--g); border-radius:4px; font-family:inherit; font-size:14px; }
        input:focus, select:focus, textarea:focus { border-color:var(--g); box-shadow:0 0 8px var(--g); outline:none; }
        textarea { resize:vertical; min-height:60px; }

        /* === PHOTO UPLOAD === */
        .photo-area { border:1px dashed var(--g); padding:20px; text-align:center; border-radius:6px; cursor:pointer; transition:all 0.2s; }
        .photo-area:hover { border-style:solid; box-shadow:0 0 12px var(--g); }
        .photo-preview { max-width:120px; max-height:120px; border-radius:4px; margin-top:10px; display:none; border:1px solid var(--border); object-fit:cover; }
        .photo-preview.show { display:block; }

        /* === STATUS BADGES === */
        .status-inhand { color:var(--g); font-weight:bold; }
        .status-listed { color:var(--blue); font-weight:bold; }
        .status-sold { color:var(--yellow); font-weight:bold; }

        .submit { padding:12px 25px; background:linear-gradient(180deg,var(--g),var(--gd)); color:#002200; border:none; border-radius:4px; font-weight:bold; cursor:pointer; box-shadow:0 0 12px var(--g); transition:all 0.2s; margin-top:8px; }
        .submit:hover { box-shadow:0 0 25px var(--g); transform:translateY(-2px); }

        /* === INVENTORY LIST — NO DELETE BUTTONS! === */
        .list { border:1px solid var(--border); background:var(--card); border-radius:8px; overflow:hidden; }
        .hdr { display:grid; grid-template-columns:60px 2fr 1.5fr 1fr 1fr 1fr 110px; padding:12px; background:#082008; border-bottom:1px solid var(--border); font-weight:bold; color:var(--gd); font-size:0.85rem; }
        .item-row { display:grid; grid-template-columns:60px 2fr 1.5fr 1fr 1fr 1fr 110px; padding:12px; border-bottom:1px solid #002200; align-items:center; transition:background 0.2s; }
        .item-row:hover { background:#082008; }
        .item-img { width:50px; height:50px; object-fit:cover; border-radius:4px; border:1px solid var(--border); }
        .empty { padding:40px; text-align:center; color:#005511; }
        .sold-btn { padding:5px 10px; background:transparent; border:1px solid var(--yellow); color:var(--yellow); border-radius:4px; cursor:pointer; font-family:inherit; font-weight:bold; transition:all 0.2s; }
        .sold-btn:hover { background:var(--yellow); color:#000; box-shadow:0 0 10px var(--yellow); }
    </style>
</head>
<body>

<div class="bar">
    <div class="logo glow">▶ RESOLTRACKER</div>
    <div class="nav">
        <button class="btn" onclick="location.href='dashboard.html'">Dashboard</button>
        <button class="btn" onclick="location.href='sales.html'">Sales</button>
        <button class="btn active">Inventory</button>
        <button class="btn" onclick="location.href='ai.html'">🎨 AI Images</button>
        <button class="btn red" onclick="location.href='/api/logout'">LOGOUT</button>
    </div>
</div>

<div class="wrap">
    <h1 class="title glow">▸ INVENTORY MANAGER</h1>

    <!-- ➕ ADD NEW ITEM FORM -->
    <div class="form-box">
        <h3 style="margin-bottom:18px; color:var(--gd);">▸ ADD NEW ITEM</h3>
        
        <div class="row2">
            <div class="field">
                <label>ITEM NAME / TITLE *</label>
                <input type="text" id="itemName" placeholder="e.g. Nike Air Max 95 — Grey/Blue — Size UK9">
            </div>
            <div class="field">
                <label>📷 UPLOAD PHOTO</label>
                <div class="photo-area" onclick="document.getElementById('photoInput').click()">
                    Click to upload image
                    <input type="file" id="photoInput" accept="image/*" style="display:none;">
                    <img id="previewImg" class="photo-preview">
                </div>
            </div>
        </div>

        <div class="row">
            <div class="field">
                <label>CATEGORY (Vinted Style)</label>
                <select id="category">
                    <option value="">— Select Category —</option>
                    <option value="Men › Tops › Hoodies">Men › Tops › Hoodies</option>
                    <option value="Men › Tops › Sweatshirts">Men › Tops › Sweatshirts</option>
                    <option value="Men › Tops › T-Shirts">Men › Tops › T-Shirts</option>
                    <option value="Men › Jeans">Men › Jeans</option>
                    <option value="Men › Trousers">Men › Trousers / Chinos</option>
                    <option value="Men › Jackets & Coats">Men › Jackets & Coats</option>
                    <option value="Men › Shoes › Sneakers">Men › Shoes › Sneakers</option>
                    <option value="Men › Shoes › Boots">Men › Shoes › Boots</option>
                    <option value="Men › Accessories › Hats">Men › Accessories › Hats</option>
                    <option value="Men › Accessories › Bags">Men › Accessories › Bags</option>
                    <option value="Women › Tops › Hoodies">Women › Tops › Hoodies</option>
                    <option value="Women › Dresses">Women › Dresses</option>
                    <option value="Women › Jeans">Women › Jeans</option>
                    <option value="Women › Jackets">Women › Jackets & Coats</option>
                    <option value="Women › Shoes › Sneakers">Women › Shoes › Sneakers</option>
                    <option value="Women › Bags">Women › Bags & Purses</option>
                    <option value="Electronics › Headphones">Electronics › Headphones</option>
                    <option value="Electronics › Phones">Electronics › Phones & Cases</option>
                    <option value="Electronics › Consoles">Electronics › Consoles & Games</option>
                    <option value="Other">Other / Misc</option>
                </select>
            </div>
            <div class="field">
                <label>STATUS</label>
                <select id="status">
                    <option value="In Hand" selected>🟢 In Hand</option>
                    <option value="Listed">🔵 Listed on Vinted</option>
                </select>
            </div>
            <div class="field">
                <label>PLATFORM</label>
                <select id="platform">
                    <option value="Vinted" selected>Vinted</option>
                    <option value="eBay">eBay</option>
                    <option value="Depop">Depop</option>
                    <option value="Facebook">Facebook Marketplace</option>
                    <option value="Other">Other</option>
                </select>
            </div>
        </div>

        <div class="row">
            <div class="field">
                <label>BOUGHT FOR (£)</label>
                <input type="number" step="0.01" id="buyPrice" placeholder="What you paid">
            </div>
            <div class="field">
                <label>LISTED PRICE (£)</label>
                <input type="number" step="0.01" id="listPrice" placeholder="Your listing price">
            </div>
            <div class="field">
                <label>DATE PURCHASED</label>
                <input type="date" id="buyDate">
            </div>
        </div>

        <div class="field">
            <label>NOTES / SIZE / BRAND</label>
            <textarea id="notes" placeholder="Brand, size, condition, colour, measurements..."></textarea>
        </div>

        <button class="submit" onclick="addItem()">▶ SAVE ITEM TO INVENTORY</button>
    </div>

    <!-- 📋 INVENTORY LIST — NO DELETE BUTTONS! -->
    <h2 class="title" style="margin-top:35px;">▸ YOUR STOCK — DATA NEVER DELETED ✅</h2>
    <div class="list">
        <div class="hdr">
            <div>IMG</div>
            <div>ITEM NAME</div>
            <div>CATEGORY</div>
            <div>COST</div>
            <div>PRICE</div>
            <div>STATUS</div>
            <div>ACTION</div>
        </div>
        <div id="invList">
            <div class="empty">📭 Inventory empty. Add your first item above!</div>
        </div>
    </div>
</div>

<script>
let uploadedImageUrl = '';

// Photo preview
document.getElementById('photoInput').addEventListener('change', async e => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async ev => {
        document.getElementById('previewImg').src = ev.target.result;
        document.getElementById('previewImg').classList.add('show');
        
        // Upload to server
        const res = await fetch('/api/upload-image', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                base64: ev.target.result,
                name: file.name
            })
        });
        const d = await res.json();
        if(d.success) uploadedImageUrl = d.url;
    };
    reader.readAsDataURL(file);
});

loadInventory();

async function loadInventory(){
    const res = await fetch('/api/inventory');
    const data = await res.json();
    
    if(!data.items || data.items.length === 0){
        document.getElementById('invList').innerHTML = `<div class="empty">📭 No items in inventory yet.</div>`;
        return;
    }

    document.getElementById('invList').innerHTML = data.items.map(item => {
        const statusClass = item.status === 'Sold' ? 'status-sold' : 
                            item.status === 'Listed' ? 'status-listed' : 'status-inhand';
        return `
            <div class="item-row">
                <div>${item.item_image ? `<img src="${item.item_image}" class="item-img">` : '—'}</div>
                <div><strong>${escapeHtml(item.item_name)}</strong><br><small style="color:#006622;">${escapeHtml(item.notes||'')}</small></div>
                <div style="font-size:0.85rem; color:#008822;">${escapeHtml(item.category||'—')}</div>
                <div>£${(item.purchase_price||0).toFixed(2)}</div>
                <div>£${(item.listed_price||0).toFixed(2)}</div>
                <div class="${statusClass}">${item.status}</div>
                <div>
                    ${item.status !== 'Sold' 
                        ? `<button class="sold-btn" onclick="markSold(${item.id}, ${item.purchase_price||0})">💰 MARK SOLD</button>` 
                        : '<span style="color:#005511;">✅ In Sales</span>'}
                </div>
            </div>
        `;
    }).join('');
}

async function addItem(){
    const name = document.getElementById('itemName').value.trim();
    const cat = document.getElementById('category').value;
    const status = document.getElementById('status').value;
    const platform = document.getElementById('platform').value;
    const buyPrice = parseFloat(document.getElementById('buyPrice').value || 0);
    const listPrice = parseFloat(document.getElementById('listPrice').value || 0);
    const buyDate = document.getElementById('buyDate').value;
    const notes = document.getElementById('notes').value.trim();

    if(!name) return alert('⚠ Enter item name first!');

    const res = await fetch('/api/inventory/add', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            item_name: name,
            item_image: uploadedImageUrl,
            category: cat,
            purchase_price: buyPrice,
            listed_price: listPrice,
            purchase_date: buyDate,
            platform: platform,
            notes: notes
        })
    });

    if((await res.json()).success){
        // Clear form
        document.getElementById('itemName').value = '';
        document.getElementById('category').value = '';
        document.getElementById('buyPrice').value = '';
        document.getElementById('listPrice').value = '';
        document.getElementById('buyDate').value = '';
        document.getElementById('notes').value = '';
        document.getElementById('previewImg').classList.remove('show');
        uploadedImageUrl = '';
        loadInventory();
    }
}

async function markSold(id, costPrice){
    const soldPrice = prompt('Enter SOLD PRICE (£):');
    if(!soldPrice) return;
    const fees = prompt('Enter FEES (£) — press Enter if none:') || 0;
    const shipping = prompt('Enter SHIPPING COST (£) — press Enter if none:') || 0;

    const res = await fetch('/api/inventory/mark-sold', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
            id, 
            sold_price: parseFloat(soldPrice),
            fees: parseFloat(fees),
            shipping_cost: parseFloat(shipping)
        })
    });

    if((await res.json()).success){
        alert('✅ Item moved to Sales Log! Data SAFE!');
        loadInventory();
    }
}

function escapeHtml(t){
    if(!t) return '';
    const div = document.createElement('div');
    div.textContent = t;
    return div.innerHTML;
}
</script>
</body>
</html>

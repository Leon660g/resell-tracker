<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📦 Inventory — RR Resell Tracker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #0f172a; color: white; min-height: 100vh; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap:15px; }
        h1 { font-size: 1.8rem; }
        .btn { padding: 10px 18px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn-back { background: #475569; color: white; }
        .btn-logout { background: #ef4444; color: white; }
        .card { background: #1e293b; border-radius: 16px; padding: 24px; margin-bottom: 20px; }
        .card h2 { font-size: 1.2rem; margin-bottom: 15px; color: #10b981; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
        .form-grid.full { grid-column: 1 / -1; }
        input, select, textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 0.95rem; }
        .btn-primary { background: #10b981; color: white; margin-top: 8px; width:100%; font-size:1rem; padding:12px; }
        .item { background: #2a3447; padding: 15px; border-radius: 10px; margin-bottom: 10px; }
        .item-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap:8px; margin-top:8px; }
        .item-url { font-size:0.8rem; color:#93c5fd; word-break:break-all; margin:6px 0; }
        .item-url a { color:#93c5fd; }
        .btn-delete { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
        .btn-status { background: #3b82f6; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; margin-left: 8px; }
        .empty { color: #94a3b8; text-align: center; padding: 30px; }
        label { font-size:0.85rem; color:#cbd5e1; display:block; margin-bottom:4px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📦 My Inventory</h1>
            <div style="display:flex;gap:10px;">
                <a href="index.html" class="btn btn-back">← Home</a>
                <button class="btn btn-logout" onclick="logout()">Logout</button>
            </div>
        </div>

        <!-- ADD ITEM FORM — NOW WITH URL! -->
        <div class="card">
            <h2>➕ Add New Item</h2>
            <div class="form-grid">
                <div><label>Item Name</label><input type="text" id="itemName" placeholder="e.g. Nike Trainers"></div>
                <div><label>Buy Price (£)</label><input type="number" step="0.01" id="buyPrice" placeholder="0.00"></div>
                <div><label>Status</label><select id="itemStatus"><option value="available">✅ Available</option><option value="pending">⏳ Pending</option><option value="sold">💰 Sold</option></select></div>
                <div class="form-grid full"><label>🔗 Listing URL (Vinted/eBay/etc)</label><input type="url" id="itemUrl" placeholder="Paste your link here..."></div>
            </div>
            <button class="btn btn-primary" onclick="addItem()">➕ Save Item</button>
        </div>

        <!-- INVENTORY LIST -->
        <div class="card">
            <h2>📋 Inventory List</h2>
            <div id="inventoryList"><p class="empty">No items yet — add your first one above!</p></div>
        </div>
    </div>

<script>
let inventory = [];

function renderItems() {
    const list = document.getElementById('inventoryList');
    if (inventory.length === 0) { 
        list.innerHTML = '<p class="empty">No items yet — add your first one above!</p>'; 
        return; 
    }
    list.innerHTML = inventory.map((item, index) => `
        <div class="item">
            <strong>${item.name}</strong> — £${item.price.toFixed(2)}
            ${item.url ? `<div class="item-url">🔗 <a href="${item.url}" target="_blank">${item.url.length>50?item.url.slice(0,50)+'...':item.url}</a></div>` : ''}
            <div class="item-row">
                <span>Status: <button class="btn-status" onclick="toggleStatus(${index})">${item.status}</button></span>
                <button class="btn-delete" onclick="deleteItem(${index})">🗑️ Delete</button>
            </div>
        </div>
    `).join('');
}

function addItem() {
    const name = document.getElementById('itemName').value.trim();
    const price = parseFloat(document.getElementById('buyPrice').value);
    const status = document.getElementById('itemStatus').value;
    const url = document.getElementById('itemUrl').value.trim();
    
    if (!name || isNaN(price)) return alert('⚠️ Fill in name and price!');
    
    inventory.unshift({ name, price, status, url });
    saveToDB(); 
    renderItems();
    
    // Clear form
    document.getElementById('itemName').value = ''; 
    document.getElementById('buyPrice').value = ''; 
    document.getElementById('itemUrl').value = '';
}

function toggleStatus(index) {
    const statuses = ['available', 'pending', 'sold'];
    const labels = ['✅ Available', '⏳ Pending', '💰 Sold'];
    const current = statuses.indexOf(inventory[index].status);
    inventory[index].status = statuses[(current + 1) % 3];
    saveToDB(); 
    renderItems();
}

function deleteItem(index) {
    if (confirm('Delete this item?')) { 
        inventory.splice(index, 1); 
        saveToDB(); 
        renderItems(); 
    }
}

function saveToDB() {
    fetch('/api/user/save', { 
        method: 'POST', 
        headers: {'Content-Type': 'application/json'}, 
        body: JSON.stringify({ dataType: 'inventory', data: { inventory } }) 
    });
}

async function loadFromDB() {
    const res = await fetch('/api/user/load/inventory');
    const result = await res.json();
    if (result.data && result.data.inventory) { 
        inventory = result.data.inventory; 
        renderItems(); 
    }
}

function logout() { window.location.href = '/api/logout'; }
window.addEventListener('load', loadFromDB);
</script>
</body>
</html>

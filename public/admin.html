<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>🔒 Admin Panel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #0f172a; color: white; padding: 30px; }
        
        /* LOGIN SCREEN */
        .login-box { max-width: 420px; margin: 100px auto; background: #1e293b; padding: 35px; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
        .login-box h2 { text-align: center; color: #a855f7; margin-bottom: 25px; font-size: 1.5rem; }
        .login-box input { width: 100%; padding: 14px; margin-bottom: 18px; border-radius: 10px; border: 2px solid #475569; background: #0f172a; color: white; font-size: 16px; outline: none; }
        .login-box input:focus { border-color: #a855f7; }
        .login-box button { width: 100%; padding: 14px; border-radius: 10px; border: none; background: linear-gradient(135deg, #a855f7, #6366f1); color: white; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .login-box button:hover { transform: translateY(-2px); }
        .status-box { margin-top: 15px; padding: 12px; border-radius: 8px; text-align: center; font-size: 14px; display: none; }
        .error { background: #7c2d2d; color: #ffb3b3; }
        .success { background: #2d7c46; color: #b3ffc7; }

        /* ADMIN CONTENT */
        .admin-content { max-width: 1000px; margin: 0 auto; display: none; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .header h1 { color: #a855f7; font-size: 1.8rem; }
        .logout-btn { background: #ef4444; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .card { background: #1e293b; padding: 25px; border-radius: 14px; margin-bottom: 25px; }
        .card h3 { color: #10b981; margin-bottom: 18px; font-size: 1.1rem; }
        .notif-item { background: #2a3447; padding: 14px; margin-bottom: 10px; border-radius: 8px; border-left: 3px solid #10b981; }
        .notif-item.new { border-left-color: #ef4444; background: #1e3a5f; }
        .notif-time { font-size: 12px; color: #94a3b8; margin-top: 6px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 13px 12px; text-align: left; border-bottom: 1px solid #334155; font-size: 14px; }
        th { color: #94a3b8; font-size: 13px; text-transform: uppercase; }
        .email { color: #93c5fd; }
        .empty { color: #94a3b8; text-align: center; padding: 20px; }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="login-box">
        <h2>🔒 Admin Login</h2>
        <input type="password" id="passInput" placeholder="Enter admin password...">
        <button onclick="doLogin()">🔓 Unlock Admin Panel</button>
        <div id="statusBox" class="status-box"></div>
    </div>

    <!-- ADMIN CONTENT -->
    <div id="adminContent" class="admin-content">
        <div class="header">
            <h1>🔒 Admin Panel — UNLOCKED ✅</h1>
            <button class="logout-btn" onclick="logout()">🚪 Logout</button>
        </div>

        <div class="card">
            <h3>🔔 New Signups</h3>
            <div id="notifications">
                <p class="empty">Loading...</p>
            </div>
        </div>

        <div class="card">
            <h3>👥 All Registered Users</h3>
            <table>
                <thead>
                    <tr><th>ID</th><th>Username</th><th>Email Address</th><th>Joined Date</th></tr>
                </thead>
                <tbody id="usersTable">
                    <tr><td colspan="4" class="empty">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

<script>
const CORRECT_PASSWORD = "Giraffe";

function showStatus(message, isSuccess) {
    const box = document.getElementById('statusBox');
    box.className = 'status-box ' + (isSuccess ? 'success' : 'error');
    box.textContent = message;
    box.style.display = 'block';
}

function doLogin() {
    const input = document.getElementById('passInput').value.trim();
    document.getElementById('statusBox').style.display = 'none';

    // Quick local check
    if (input !== CORRECT_PASSWORD) {
        showStatus("❌ Wrong password! Try: Giraffe", false);
        return;
    }

    showStatus("✅ Password OK — connecting to server...", true);

    // Send to server
    fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: input })
    })
    .then(res => res.json())
    .then(data => {
        if (data.success) {
            showStatus("✅ UNLOCKED! Loading data...", true);
            // ✅ SWITCH SCREENS — DIRECT DISPLAY CHANGE
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('adminContent').style.display = 'block';
            loadAdminData();
        } else {
            showStatus("❌ Server rejected password", false);
        }
    })
    .catch(err => {
        showStatus("❌ Error: " + err.message, false);
    });
}

function loadAdminData() {
    fetch('/api/admin/alldata')
    .then(res => res.json())
    .then(data => {
        // Notifications
        if (data.notifications && data.notifications.length > 0) {
            document.getElementById('notifications').innerHTML = data.notifications.map(n => `
                <div class="notif-item ${!n.read ? 'new' : ''}">
                    ${!n.read ? '🟢 NEW' : '✅'} — ${n.message}
                    <div class="notif-time">${n.timestamp}</div>
                </div>
            `).join('');
        } else {
            document.getElementById('notifications').innerHTML = '<p class="empty">No new signups yet.</p>';
        }

        // Users table
        if (data.users && data.users.length > 0) {
            document.getElementById('usersTable').innerHTML = data.users.map(u => `
                <tr>
                    <td>${u.id}</td>
                    <td><strong>${u.username}</strong></td>
                    <td class="email">${u.email}</td>
                    <td>${u.created_at}</td>
                </tr>
            `).join('');
        } else {
            document.getElementById('usersTable').innerHTML = '<tr><td colspan="4" class="empty">No users registered yet.</td></tr>';
        }
    })
    .catch(err => {
        document.getElementById('notifications').innerHTML = `<p style="color:#ff6b6b;">❌ Load Error: ${err.message}</p>`;
    });
}

function logout() {
    fetch('/api/logout').then(() => {
        window.location.href = '/login.html';
    });
}
</script>
</body>
</html>
